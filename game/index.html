<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sky Story</title>
<link rel="stylesheet" href="scene.css"></head><body>
<header><h1>Choose your avatar</h1><span>Seattle → San Francisco</span></header>
<main><section class="panel"><div class="stats"><div class="route-display" id="flight-route">SEA → SFO</div><div class="stat"><strong id="score">0</strong><span class="muted">points</span></div><div class="stat"><strong id="time">2:00</strong><span class="muted">to landing</span></div><div class="stat"><strong id="served">0</strong><span class="muted">served</span></div></div><div class="progress"><span id="progress"></span></div><div class="cabin"><button class="galley" id="galley">Refill tray</button><div class="crew" id="crew">👩‍✈️</div><div class="rows" id="rows"></div></div></section>
<aside class="panel"><div class="tray-head"><h2>TRAY</h2><span id="stock" class="muted">6 / 6</span></div><div class="drinks"><button data-drink="water" class="selected" aria-label="Water" aria-pressed="true">💧</button><button data-drink="coffee" aria-label="Coffee" aria-pressed="false">☕</button><button data-drink="soda" aria-label="Soda" aria-pressed="false">🥤</button><button data-drink="pretzels" aria-label="Pretzels" aria-pressed="false">🥨</button><button data-drink="cookies" aria-label="Cookies" aria-pressed="false">🍪</button><button data-drink="snackbox" aria-label="Snack box" aria-pressed="false">🍱</button></div><div id="message" role="status" aria-live="polite"></div></aside><div class="welcome" id="welcome"><div class="welcome-card"><h1>Choose your avatar</h1><p>Seattle → San Francisco</p><div class="flight-summary" id="summary"></div><button class="primary" id="start">Play</button><div id="result"></div></div></div></main>
<script src="game-storage.js"></script><script src="family-service.js"></script><script>
const icons={water:'💧',coffee:'☕',soda:'🥤',pretzels:'🥨',cookies:'🍪',snackbox:'🍱'},faces=['👩🏻','👨🏽','👩🏾','👨🏻','👩🏼','👨🏾'];let seats=[],selected='water',stock=6,score=0,served=0,remaining=120,running=false,busy=false,timer=null,ticks=0,missed=0;
const $=id=>document.getElementById(id);let toastTimer;const tell=t=>{$('message').textContent=t;$('message').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('message').classList.remove('show'),3000)};
for(let row=0;row<5;row++){for(let col=0;col<5;col++){if(col===2){$('rows').appendChild(document.createElement('div'));continue}const index=seats.length,button=document.createElement('button');button.className='seat';button.innerHTML=faces[index%faces.length]+'<small>'+(row+1)+String.fromCharCode(65+(col>2?col-1:col))+'</small>';button.setAttribute('aria-label','Passenger '+(index+1));button.onclick=()=>serve(index);$('rows').appendChild(button);seats.push({button,row,request:null,patience:0});}}
let inventory={water:0,coffee:0,soda:0,pretzels:0,cookies:0,snackbox:0},atGalley=false,preparing=false,flightId=0,orders=[];
const orderBar=document.createElement('div');orderBar.className='order-queue';orderBar.setAttribute('role','group');orderBar.setAttribute('aria-label','Saved passenger orders');document.querySelector('main').appendChild(orderBar);
function renderOrders(){orders=orders.filter(index=>seats[index].queued&&seats[index].request);orderBar.replaceChildren();const available={...inventory};orders.forEach(index=>{const s=seats[index],drink=s.request,ready=available[drink]>0;if(ready)available[drink]--;const chip=document.createElement('button');chip.className='order-chip'+(ready?' ready':'')+(s.patience<10?' urgent':'');const label=s.button.querySelector('small').textContent;chip.textContent=icons[drink]+' '+label+(familyService.groupFor(index)>=0?' ♡':'');chip.setAttribute('aria-label',label+', '+drink+(ready?', ready to serve':', needs preparation')+', '+s.patience+' seconds remaining');chip.title=ready?'Tap to serve':'Tap to visit passenger';chip.onclick=()=>serve(index);orderBar.appendChild(chip)});seats.forEach(s=>s.button.classList.toggle('queued',Boolean(s.queued&&s.request)))}
function updateTray(){renderOrders();stock=Object.values(inventory).reduce((sum,n)=>sum+n,0);document.querySelector('.tray-head h2').textContent=atGalley?'PREPARE · TAP AN ITEM':'TRAY';document.body.classList.toggle('preparing',atGalley);document.querySelectorAll('[data-drink]').forEach(b=>{const drink=b.dataset.drink;b.innerHTML=icons[drink]+'<span>'+inventory[drink]+'</span>';b.setAttribute('aria-label',drink+', '+inventory[drink]+' on tray'+(atGalley?', tap to prepare':''));b.classList.toggle('selected',drink===selected);b.setAttribute('aria-pressed',String(drink===selected))});$('stock').textContent=stock+' / 6';if(typeof updateCrewSprite==='function')updateCrewSprite()}
async function prepareDrink(drink){if(!running||busy||!atGalley)return;if(stock>=6){tell('Tray full. Serve drinks to make space.');return}const id=flightId;busy=true;preparing=true;const button=document.querySelector('[data-drink="'+drink+'"]');button.classList.add('selected');tell('Preparing '+drink+'…');await new Promise(resolve=>setTimeout(resolve,(drink==='coffee'||drink==='snackbox')?1200:650));if(id!==flightId||!running)return;inventory[drink]++;selected=drink;preparing=false;busy=false;updateTray();tell('Ready. Add another drink or tap a passenger.')}
document.querySelectorAll('[data-drink]').forEach(b=>b.onclick=()=>{if(!running)return;if(atGalley){prepareDrink(b.dataset.drink);return}selected=b.dataset.drink;updateTray();if(!inventory[selected])tell('No '+selected+' on your tray. Tap the galley to prepare it.')});
function render(){ if(typeof refreshPassengerSprites==='function')refreshPassengerSprites();renderOrders();$('stock').textContent=stock+' / 6';$('score').textContent=score;$('served').textContent=served;$('time').textContent=Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0');$('progress').style.width=((120-remaining)/120*100)+'%';seats.forEach(s=>{s.button.querySelector('.request')?.remove();s.button.classList.toggle('urgent',s.request&&s.patience<10);if(s.request){let badge=document.createElement('span');badge.className='request';badge.textContent=icons[s.request];s.button.appendChild(badge)}s.button.setAttribute('aria-label',familyService.role(seats.indexOf(s))+', seat '+s.button.querySelector('small').textContent+(s.request?', requests '+s.request+', '+s.patience+' seconds remaining':', no request'))})}
function request(){let free=seats.map((s,i)=>({s,i})).filter(({s,i})=>s.row<cabinRows&&!s.request&&familyService.eligible(i)&&seats.filter(p=>p.request).length+requestMembers(i).length<=activeRequestLimit());if(!free.length)return;const {i}=free[Math.floor(Math.random()*free.length)];familyService.start(i,seats,Object.keys(icons),routes[routeIndex].patience);render()}
const cabin=document.querySelector('.cabin'),crew=$('crew');
const interior=document.createElement('div');interior.className='interior';interior.setAttribute('aria-hidden','true');interior.innerHTML='<div class="flight-deck">FLIGHT DECK</div><div class="storage left"></div><div class="storage right"></div><div class="rear-door left">EXIT</div><div class="rear-door right">EXIT</div><div class="lavatory">WC</div>';cabin.prepend(interior);
const windows=[];for(let row=0;row<5;row++){for(const side of ['left','right']){const pane=document.createElement('div');pane.className='plane-window '+side;interior.appendChild(pane);windows.push({pane,row})}}
function positionWindows(){windows.forEach(({pane,row})=>{const seat=seats.find(s=>s.row===row).button;pane.style.top=(seat.offsetTop+seat.offsetHeight/2-13)+'px'})}positionWindows();window.addEventListener('resize',positionWindows);
const marker=document.createElement('div');marker.className='walk-marker';cabin.appendChild(marker);
let motion=null,frame=null;
function stopWalking(){if(frame!==null)cancelAnimationFrame(frame);frame=null;if(motion)motion.resolve(false);motion=null;busy=false;crew.classList.remove('walking');marker.classList.remove('visible');if(typeof clearCrewAction==='function')clearCrewAction()}
function floorPoint(x,y){const first=seats[0].button,last=seats[cabinRows*4-1].button;const center=cabin.clientWidth/2;const front=first.offsetTop-20,back=last.offsetTop+last.offsetHeight+20;const cy=Math.max(54,Math.min(cabin.clientHeight-20,y));return {x:cy<front||cy>back?Math.max(32,Math.min(cabin.clientWidth-32,x)):center,y:cy}}
function walkTo(x,y){if(preparing)return Promise.resolve(false);atGalley=false;updateTray();stopWalking();const destination=floorPoint(x,y);const current={x:crew.offsetLeft+17,y:crew.offsetTop+18};const center=cabin.clientWidth/2;const path=[];
// Enter the aisle before changing rows, then approach the destination.
if(Math.abs(current.x-center)>1)path.push({x:center,y:current.y});path.push({x:center,y:destination.y});path.push(destination);
busy=true;crew.classList.add('walking');marker.style.left=destination.x+'px';marker.style.top=destination.y+'px';marker.classList.add('visible');
return new Promise(resolve=>{motion={resolve};let previous=null;function step(now){if(!running){stopWalking();return}const dt=previous===null?0:Math.min((now-previous)/1000,.05);previous=now;let target=path[0];const dx=target.x-current.x,dy=target.y-current.y,distance=Math.hypot(dx,dy),travel=190*dt;if(typeof updateCrewSprite==='function')updateCrewSprite(dx,dy,now);if(distance<=travel||distance<1){current.x=target.x;current.y=target.y;path.shift()}else{current.x+=dx/distance*travel;current.y+=dy/distance*travel}crew.style.left=(current.x-17)+'px';crew.style.top=(current.y-18)+'px';if(path.length){frame=requestAnimationFrame(step)}else{frame=null;motion=null;busy=false;crew.classList.remove('walking');marker.classList.remove('visible');if(typeof updateCrewSprite==='function')updateCrewSprite();resolve(true)}}frame=requestAnimationFrame(step)})}
async function walk(row){return walkTo(cabin.clientWidth/2,row<0?104:seats.find(s=>s.row===row).button.offsetTop+seats.find(s=>s.row===row).button.offsetHeight/2)}
cabin.addEventListener('click',event=>{if(!running||event.target.closest('button'))return;const rect=cabin.getBoundingClientRect();walkTo(event.clientX-rect.left-cabin.clientLeft,event.clientY-rect.top-cabin.clientTop)});
document.addEventListener('keydown',event=>{if(!running||!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();const origin=motion?{x:parseFloat(marker.style.left),y:parseFloat(marker.style.top)}:{x:crew.offsetLeft+17,y:crew.offsetTop+18};walkTo(origin.x+(event.key==='ArrowLeft'?-28:event.key==='ArrowRight'?28:0),origin.y+(event.key==='ArrowUp'?-36:event.key==='ArrowDown'?36:0))});
window.addEventListener('resize',()=>{stopWalking();crew.style.left=(cabin.clientWidth/2-17)+'px';crew.style.top=Math.min(crew.offsetTop,cabin.clientHeight-38)+'px'});
async function serve(index){if(!running||busy)return;let s=seats[index];if(!s.request){const arrived=await walk(s.row);if(arrived)speakPassenger(s,'I am all set, thank you.','neutral');return}const drink=s.request;if(!inventory[drink]){if(!familyService.collect(index,seats,orders)){tell('Not enough order slots. Serve an order to make room for this group.');return}renderOrders();saveFlight();const arrived=await walk(s.row);if(arrived&&s.request===drink)speakPassenger(s,familyService.groupFor(index)>=0?'Please bring our family orders. They are saved together above.':'Could I have '+drink.replace('snackbox','a snack box')+', please?');return}const arrived=await walk(s.row);if(!arrived||!running||s.request!==drink)return;crewDirection=s.button.offsetLeft<cabin.clientWidth/2?'left':'right';const animated=await animateCrewService();if(!animated||!running||s.request!==drink||!inventory[drink])return;const serviceMood=s.patience>=15?'very-happy':'happy';inventory[drink]--;score+=s.patience>=15?100:60;served++;const familyBonus=familyService.resolve(index,true);score+=familyBonus;s.reactionMood=serviceMood;s.reactionUntil=Date.now()+3500;s.request=null;s.queued=false;updateTray();const reaction=document.createElement('span');reaction.className='reaction';reaction.textContent='♥';s.button.appendChild(reaction);s.button.classList.add('happy');setTimeout(()=>{reaction.remove();s.button.classList.remove('happy')},900);speakPassenger(s,familyBonus?'Everyone has their order. Thank you! +25 family bonus':familyService.role(index)==='Child'?'Thank you! This is for me!':serviceMood==='very-happy'?'That was so quick! Thank you!':'Thank you for bringing my order.',serviceMood);render()}
$('galley').textContent='Galley';
$('galley').onclick=async()=>{if(!running||busy)return;const arrived=await walk(-1);if(!arrived||!running)return;atGalley=true;updateTray();tell('Tap drinks below to prepare them. Carry up to six.')};
const routes=[{from:'Seattle',to:'San Francisco',interval:6,patience:30},{from:'San Francisco',to:'Los Angeles',interval:5,patience:28},{from:'Los Angeles',to:'New York',interval:4,patience:26}];
let routeIndex=0,career={earnings:0,flights:0,best:[0,0,0]},saveAvailable=true;
try{const saved=JSON.parse(gameStorage.getItem('cabin-crew-career-v1'));if(saved&&Number.isFinite(saved.earnings)&&Number.isInteger(saved.flights)&&Array.isArray(saved.best)&&saved.best.length===3&&saved.best.every(n=>Number.isInteger(n)&&n>=0&&n<=3))career=saved}catch{saveAvailable=false}
const picker=document.createElement('select');picker.className='route-picker';picker.setAttribute('aria-label','Choose flight route');
const careerLabel=document.createElement('div');careerLabel.className='career';
const routeHint=document.createElement('div');routeHint.className='route-hint';
$('start').before(picker,routeHint,careerLabel);
function showCareer(){const airports={Seattle:'SEA','San Francisco':'SFO','Los Angeles':'LAX','New York':'NYC'};$('flight-route').textContent=airports[routes[routeIndex].from]+' → '+airports[routes[routeIndex].to];picker.replaceChildren();routes.forEach((route,i)=>{const option=document.createElement('option');option.value=i;option.disabled=i>0&&career.best[i-1]<2;option.textContent=route.from+' → '+route.to+(option.disabled?' · Locked':career.best[i]?' · '+'★'.repeat(career.best[i]):'');picker.appendChild(option)});picker.value=routeIndex;careerLabel.textContent='$'+career.earnings+' earned · '+career.flights+' flights'+(saveAvailable?' · Saved on this browser':' · Progress stays in this session');routeHint.textContent='Serve 8 passengers and fulfill 65% of requests to earn two stars and unlock the next route.'}
picker.onchange=()=>{routeIndex=Number(picker.value);showCareer();document.querySelector('.welcome-card p').textContent=routes[routeIndex].from+' → '+routes[routeIndex].to;$('start').textContent='Play'};
function finishFlight(){clearFlightSave();clearPassengerDialogue();running=false;preparing=false;atGalley=false;updateTray();stopWalking();document.body.classList.remove('playing');clearInterval(timer);const outstanding=seats.filter(s=>s.request).length,total=served+missed+outstanding,rate=total?served/total:0;const stars=served>=14&&rate>=.85?3:served>=8&&rate>=.65?2:served>0?1:0;const pay=served?50+Math.floor(score/10):0;const wasLocked=routeIndex<2&&career.best[routeIndex]<2;career.earnings+=pay;career.flights++;career.best[routeIndex]=Math.max(career.best[routeIndex],stars);try{gameStorage.setItem('cabin-crew-career-v1',JSON.stringify(career))}catch{saveAvailable=false}const summary=$('summary');summary.replaceChildren();const rating=document.createElement('span');rating.className='stars';rating.textContent='★'.repeat(stars)+'☆'.repeat(3-stars);const title=document.createElement('strong');title.textContent='Welcome to '+routes[routeIndex].to;const details=document.createElement('div');details.textContent=served+' served · '+(missed+outstanding)+' unfulfilled · '+familyService.bonuses+' families completed · $'+pay+' earned';summary.append(rating,title,details);if(wasLocked&&stars>=2){const unlock=document.createElement('p');unlock.textContent='New route unlocked: '+routes[routeIndex+1].to+'!';summary.appendChild(unlock)}$('start').textContent='Fly again';picker.hidden=false;showCareer()}
$('start').onclick=()=>{if(busy||running)return;clearInterval(timer);clearPassengerDialogue();orders=[];familyService.reset();seats.forEach(s=>{s.request=null;s.queued=false;s.reactionUntil=0});flightId++;inventory={water:0,coffee:0,soda:0,pretzels:0,cookies:0,snackbox:0};stock=0;preparing=false;atGalley=false;updateTray();score=0;served=0;missed=0;remaining=120;ticks=0;running=true;document.body.classList.add('playing');$('result').style.display='none';crew.style.left=(cabin.clientWidth/2-17)+'px';crew.style.top='92px';tell('Tap a marked family seat to collect both orders. Prepare items at the galley.');familyService.start(4,seats,Object.keys(icons),30);request();render();saveFlight();beginFlightClock()};
function beginFlightClock(){clearInterval(timer);timer=setInterval(()=>{remaining--;ticks++;seats.forEach(s=>{if(s.request&&--s.patience<=0){speakPassenger(s,'I was hoping my order would arrive soon.','very-mad');familyService.resolve(seats.indexOf(s),false);s.request=null;s.queued=false;missed++;score=Math.max(0,score-30);tell('A passenger waited too long. Watch the red request bubbles.')}});if(remaining>0&&ticks%routes[routeIndex].interval===0)request();render();if(remaining<=0)finishFlight();else saveFlight()},1000)};
showCareer();picker.hidden=true;routeHint.hidden=true;careerLabel.hidden=true;
updateTray();render();
</script><script src="passenger-dialogue.js"></script><script src="character-art.js"></script><script src="mobile-layout.js"></script><script src="flight-save.js"></script></body></html>
