busy=true;crew.classList.add('walking');marker.style.left=destination.x+'px';marker.style.top=destination.y+'px';marker.classList.add('visible');
return new Promise(resolve=>{motion={resolve};let previous=null;function step(now){if(!running){stopWalking();return}const dt=previous===null?0:Math.min((now-previous)/1000,.05);previous=now;let target=path[0];const dx=target.x-current.x,dy=target.y-current.y,distance=Math.hypot(dx,dy),travel=190*dt;if(typeof updateCrewSprite==='function')updateCrewSprite(dx,dy,now);if(distance<=travel||distance<1){current.x=target.x;current.y=target.y;path.shift()}else{current.x+=dx/distance*travel;current.y+=dy/distance*travel}crew.style.left=(current.x-17)+'px';crew.style.top=(current.y-18)+'px';if(path.length){frame=requestAnimationFrame(step)}else{frame=null;motion=null;busy=false;crew.classList.remove('walking');marker.classList.remove('visible');if(typeof updateCrewSprite==='function')updateCrewSprite();resolve(true)}}frame=requestAnimationFrame(step)})}
async function walk(row){return walkTo(cabin.clientWidth/2,row<0?54:seats.find(s=>s.row===row).button.offsetTop+seats.find(s=>s.row===row).button.offsetHeight/2)}
cabin.addEventListener('click',event=>{if(!running||event.target.closest('button'))return;const rect=cabin.getBoundingClientRect();walkTo(event.clientX-rect.left-cabin.clientLeft,event.clientY-rect.top-cabin.clientTop)});
document.addEventListener('keydown',event=>{if(!running||!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();const origin=motion?{x:parseFloat(marker.style.left),y:parseFloat(marker.style.top)}:{x:crew.offsetLeft+17,y:crew.offsetTop+18};walkTo(origin.x+(event.key==='ArrowLeft'?-28:event.key==='ArrowRight'?28:0),origin.y+(event.key==='ArrowUp'?-36:event.key==='ArrowDown'?36:0))});
window.addEventListener('resize',()=>{stopWalking();crew.style.left=(cabin.clientWidth/2-17)+'px';crew.style.top=Math.min(crew.offsetTop,cabin.clientHeight-38)+'px'});
async function serve(index){if(!running||busy)return;let s=seats[index];if(!s.request){const arrived=await walk(s.row);if(arrived)speakPassenger(s,'I am all set, thank you.','neutral');return}const drink=s.request;if(!inventory[drink]){if(!familyService.collect(index,seats,orders)){tell('Not enough order slots. Serve an order to make room for this group.');return}renderOrders();saveFlight();const arrived=await walk(s.row);if(arrived&&s.request===drink)speakPassenger(s,familyService.groupFor(index)>=0?'Please bring our family orders. They are saved together above.':'Could I have '+drink.replace('snackbox','a snack box')+', please?');return}const arrived=await walk(s.row);if(!arrived||!running||s.request!==drink)return;const animated=await animateCrewService();if(!animated||!running||s.request!==drink||!inventory[drink])return;const serviceMood=s.patience>=15?'very-happy':'happy';inventory[drink]--;score+=s.patience>=15?100:60;served++;const familyBonus=familyService.resolve(index,true);score+=familyBonus;s.reactionMood=serviceMood;s.reactionUntil=Date.now()+3500;s.request=null;s.queued=false;updateTray();const reaction=document.createElement('span');reaction.className='reaction';reaction.textContent='♥';s.button.appendChild(reaction);s.button.classList.add('happy');setTimeout(()=>{reaction.remove();s.button.classList.remove('happy')},900);speakPassenger(s,familyBonus?'Everyone has their order. Thank you! +25 family bonus':familyService.role(index)==='Child'?'Thank you! This is for me!':serviceMood==='very-happy'?'That was so quick! Thank you!':'Thank you for bringing my order.',serviceMood);render()}
$('galley').textContent='Galley · prepare';
$('galley').onclick=async()=>{if(!running||busy)return;const arrived=await walk(-1);if(!arrived||!running)return;atGalley=true;updateTray();tell('Tap drinks below to prepare them. Carry up to six.')};
const routes=[{from:'Seattle',to:'San Francisco',interval:6,patience:30},{from:'San Francisco',to:'Los Angeles',interval:5,patience:28},{from:'Los Angeles',to:'New York',interval:4,patience:26}];
let routeIndex=0,career={earnings:0,flights:0,best:[0,0,0]},saveAvailable=true;
try{const saved=JSON.parse(gameStorage.getItem('cabin-crew-career-v1'));if(saved&&Number.isFinite(saved.earnings)&&Number.isInteger(saved.flights)&&Array.isArray(saved.best)&&saved.best.length===3&&saved.best.every(n=>Number.isInteger(n)&&n>=0&&n<=3))career=saved}catch{saveAvailable=false}
const picker=document.createElement('select');picker.className='route-picker';picker.setAttribute('aria-label','Choose flight route');
const careerLabel=document.createElement('div');careerLabel.className='career';
const routeHint=document.createElement('div');routeHint.className='route-hint';
$('start').before(picker,routeHint,careerLabel);
function showCareer(){picker.replaceChildren();routes.forEach((route,i)=>{const option=document.createElement('option');option.value=i;option.disabled=i>0&&career.best[i-1]<2;option.textContent=route.from+' → '+route.to+(option.disabled?' · Locked':career.best[i]?' · '+'★'.repeat(career.best[i]):'');picker.appendChild(option)});picker.value=routeIndex;careerLabel.textContent='$'+career.earnings+' earned · '+career.flights+' flights'+(saveAvailable?' · Saved on this browser':' · Progress stays in this session');routeHint.textContent='Serve 8 passengers and fulfill 65% of requests to earn two stars and unlock the next route.'}
picker.onchange=()=>{routeIndex=Number(picker.value);document.querySelector('.welcome-card p').textContent=routes[routeIndex].from+' → '+routes[routeIndex].to;$('start').textContent='Play'};
function finishFlight(){clearFlightSave();clearPassengerDialogue();running=false;preparing=false;atGalley=false;updateTray();stopWalking();document.body.classList.remove('playing');clearInterval(timer);const outstanding=seats.filter(s=>s.request).length,total=served+missed+outstanding,rate=total?served/total:0;const stars=served>=14&&rate>=.85?3:served>=8&&rate>=.65?2:served>0?1:0;const pay=served?50+Math.floor(score/10):0;const wasLocked=routeIndex<2&&career.best[routeIndex]<2;career.earnings+=pay;career.flights++;career.best[routeIndex]=Math.max(career.best[routeIndex],stars);try{gameStorage.setItem('cabin-crew-career-v1',JSON.stringify(career))}catch{saveAvailable=false}const summary=$('summary');summary.replaceChildren();const rating=document.createElement('span');rating.className='stars';rating.textContent='★'.repeat(stars)+'☆'.repeat(3-stars);const title=document.createElement('strong');title.textContent='Welcome to '+routes[routeIndex].to;const details=document.createElement('div');details.textContent=served+' served · '+(missed+outstanding)+' unfulfilled · '+familyService.bonuses+' families completed · $'+pay+' earned';summary.append(rating,title,details);if(wasLocked&&stars>=2){const unlock=document.createElement('p');unlock.textContent='New route unlocked: '+routes[routeIndex+1].to+'!';summary.appendChild(unlock)}$('start').textContent='Fly again';picker.hidden=false;showCareer()}
$('start').onclick=()=>{if(busy||running)return;clearInterval(timer);clearPassengerDialogue();orders=[];familyService.reset();seats.forEach(s=>{s.request=null;s.queued=false;s.reactionUntil=0});flightId++;inventory={water:0,coffee:0,soda:0,pretzels:0,cookies:0,snackbox:0};stock=0;preparing=false;atGalley=false;updateTray();score=0;served=0;missed=0;remaining=120;ticks=0;running=true;document.body.classList.add('playing');$('result').style.display='none';crew.style.left=(cabin.clientWidth/2-17)+'px';crew.style.top='36px';tell('Tap a marked family seat to collect both orders. Prepare items at the galley.');familyService.start(4,seats,Object.keys(icons),30);request();render();saveFlight();beginFlightClock()};
function beginFlightClock(){clearInterval(timer);timer=setInterval(()=>{remaining--;ticks++;seats.forEach(s=>{if(s.request&&--s.patience<=0){speakPassenger(s,'I was hoping my order would arrive soon.','very-mad');familyService.resolve(seats.indexOf(s),false);s.request=null;s.queued=false;missed++;score=Math.max(0,score-30);tell('A passenger waited too long. Watch the red request bubbles.')}});if(remaining>0&&ticks%routes[routeIndex].interval===0)request();render();if(remaining<=0)finishFlight();else saveFlight()},1000)};
showCareer();picker.hidden=true;routeHint.hidden=true;careerLabel.hidden=true;
updateTray();render();
